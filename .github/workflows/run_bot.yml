name: Bond Yields Bot

on:
  schedule:
    # Воскресенье 18:00 Чита (UTC+9) = 09:00 UTC
    - cron: '0 9 * * 0'
    # Пн-Пт 06:00 Чита = 21:00 UTC предыдущего дня
    - cron: '0 21 * * 0'   # Пн 06:00 Чита
    - cron: '0 21 * * 1'   # Вт 06:00 Чита
    - cron: '0 21 * * 2'   # Ср 06:00 Чита
    - cron: '0 21 * * 3'   # Чт 06:00 Чита
    - cron: '0 21 * * 4'   # Пт 06:00 Чита
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run script
        run: python bonds_bot.py
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
